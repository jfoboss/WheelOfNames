# PWA и service worker работают только по HTTPS с сертификатом, которому доверяют браузеры
# (корпоративный CA должен быть в хранилище доверенных на рабочих станциях).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wheel-of-names
  # annotations:
  #   cert-manager.io/cluster-issuer: corp-ca-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts: [wheel.example.local]
      secretName: wheel-of-names-tls
  rules:
    - host: wheel.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wheel-of-names
                port:
                  name: http
