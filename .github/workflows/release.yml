name: Release

# release-please keeps a "chore(main): release X.Y.Z" PR open with the version bump
# and CHANGELOG. Merging it creates the vX.Y.Z tag and GitHub Release; this workflow
# then publishes the image and the Helm chart with the same version.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  HELM_VERSION: v3.16.2
  IMAGE: ghcr.io/${{ github.repository_owner }}/wheel-of-names
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      # Optional mirror to Harbor: set repository variable HARBOR_REGISTRY
      # (e.g. harbor.example.com) and secrets HARBOR_USERNAME / HARBOR_PASSWORD.
      # The runner must be able to reach Harbor (self-hosted runner), otherwise
      # prefer a Harbor proxy-cache / replication rule for ghcr.io.
      HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
      HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT || 'tools' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.HARBOR_REGISTRY != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ env.IMAGE }}
            name=${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/wheel-of-names,enable=${{ env.HARBOR_REGISTRY != '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=wheel-of-names
            org.opencontainers.image.description=Wheel of Names - static PWA served by nginx-unprivileged

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package chart
        run: helm package helm/wheel-of-names --version "$VERSION" --app-version "$VERSION" -d dist

      - name: Push chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/wheel-of-names-${VERSION}.tgz" "$CHART_REPO"

      - name: Push chart to Harbor
        if: env.HARBOR_REGISTRY != ''
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | helm registry login "$HARBOR_REGISTRY" -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin
          helm push "dist/wheel-of-names-${VERSION}.tgz" "oci://${HARBOR_REGISTRY}/${HARBOR_PROJECT}/charts"

      - name: Attach chart to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "dist/wheel-of-names-${VERSION}.tgz" --clobber

      - name: Summary
        run: |
          {
            echo "### wheel-of-names ${VERSION}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "${CHART_REPO}/wheel-of-names:${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
