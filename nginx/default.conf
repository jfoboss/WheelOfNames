server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript application/manifest+json image/svg+xml;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    # Файлы без хэшей в именах: браузер всегда ревалидирует (ETag),
    # офлайн-работу обеспечивает service worker.
    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /sw.js {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ \.webmanifest$ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
