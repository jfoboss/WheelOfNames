    <!-- stand -->
    <path fill="#C58B3C" d="M170 356 C 180 336, 214 326, 256 326 C 298 326, 332 336, 342 356 L 366 420 C 330 436, 182 436, 146 420 Z"/>
    <path fill="none" stroke-width="7" d="M160 392 C 210 404, 302 404, 352 392"/>
