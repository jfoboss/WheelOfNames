    <radialGradient id="glow" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#F3E8FF"/>
      <stop offset="0.55" stop-color="#B98CFF"/>
      <stop offset="1" stop-color="#5B2DB3"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#2B2250"/>
  <!-- stars -->
  <g fill="#FFE27A">
    <path d="M100 150 l 8 18 l 18 8 l -18 8 l -8 18 l -8 -18 l -18 -8 l 18 -8 Z"/>
    <path d="M400 120 l 6 14 l 14 6 l -14 6 l -6 14 l -6 -14 l -14 -6 l 14 -6 Z"/>
    <path d="M420 280 l 5 11 l 11 5 l -11 5 l -5 11 l -5 -11 l -11 -5 l 11 -5 Z"/>
    <circle cx="150" cy="96" r="5"/><circle cx="360" cy="70" r="4"/><circle cx="80" cy="300" r="4"/>
  </g>
  <g stroke="#140F2B" stroke-width="10" stroke-linejoin="round">
