<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Original doodle in the imageboard / rage-comic spirit ("u mad?"), drawn for this project. -->
  <!-- Everything fits a circle of r=240: the wheel shows the image clipped to a circle. -->
  <g transform="translate(256 262) scale(0.93) translate(-256 -262)">
  <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <!-- head: lumpy hand-drawn blob -->
    <path fill="#fff" stroke-width="9" d="M256 132
      C 318 128, 372 150, 392 204
      C 408 246, 404 292, 386 330
      C 366 372, 324 402, 268 404
      C 206 406, 160 382, 136 340
      C 114 302, 112 250, 128 208
      C 148 158, 196 134, 256 132 Z"/>
    <!-- hatching on the cheeks -->
    <path stroke-width="4" d="M150 300 l14 -10 M158 312 l14 -10 M340 292 l14 -10 M348 304 l14 -10"/>
    <!-- smug eyebrows: one up, one flat -->
    <path stroke-width="9" d="M168 214 C 190 196, 214 194, 234 204"/>
    <path stroke-width="9" d="M282 206 C 302 212, 326 212, 350 200"/>
    <!-- half-closed smug eyes looking sideways -->
    <path stroke-width="8" d="M172 244 C 190 236, 214 236, 232 244"/>
    <path fill="#111" stroke-width="4" d="M206 244 a 13 11 0 0 0 26 0 Z"/>
    <path stroke-width="8" d="M284 242 C 302 234, 326 234, 344 242"/>
    <path fill="#111" stroke-width="4" d="M318 242 a 13 11 0 0 0 26 0 Z"/>
    <!-- lopsided grin with teeth -->
    <path fill="#fff" stroke-width="9" d="M170 300 C 196 296, 300 290, 356 270 C 350 330, 300 364, 244 360 C 206 358, 180 336, 170 300 Z"/>
    <path stroke-width="6" d="M178 316 C 230 318, 300 306, 350 288"/>
    <path stroke-width="5" d="M204 302 L 206 348 M234 300 L 236 358 M264 298 L 266 360 M294 294 L 294 356 M322 284 L 320 344"/>
    <!-- sweat drop, just in case -->
    <path fill="#fff" stroke-width="5" d="M374 176 c -10 16 -12 26 -4 32 c 8 5 18 -2 16 -12 c -2 -8 -8 -14 -12 -20 Z"/>
  </g>

  <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
    <!-- question marks -->
    <path d="M86 118 c 0 -24 36 -28 38 -6 c 2 16 -18 18 -18 38"/>
    <path fill="#111" stroke-width="2" d="M106 170 m -6 0 a 6 6 0 1 0 12 0 a 6 6 0 1 0 -12 0"/>
    <path d="M60 300 c -2 -20 30 -24 32 -4 c 1 13 -15 15 -15 31"/>
    <path fill="#111" stroke-width="2" d="M77 346 m -5 0 a 5 5 0 1 0 10 0 a 5 5 0 1 0 -10 0"/>
    <path d="M378 84 c 0 -22 34 -26 36 -6 c 2 15 -17 17 -17 35"/>
    <path fill="#111" stroke-width="2" d="M397 132 m -6 0 a 6 6 0 1 0 12 0 a 6 6 0 1 0 -12 0"/>
    <!-- exclamation marks -->
    <path d="M436 170 L 430 230"/>
    <path fill="#111" stroke-width="2" d="M428 252 m -6 0 a 6 6 0 1 0 12 0 a 6 6 0 1 0 -12 0"/>
    <path d="M180 60 L 172 108"/>
    <path fill="#111" stroke-width="2" d="M170 128 m -5 0 a 5 5 0 1 0 10 0 a 5 5 0 1 0 -10 0"/>
  </g>

  <g fill="#fff" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <!-- spiky burst with a tiny grin -->
    <path transform="translate(0 -12)" d="M268 30 l 10 22 l 20 -12 l -2 24 l 24 2 l -16 18 l 16 16 l -24 4 l 4 24 l -22 -12 l -12 20 l -8 -22 l -22 10 l 4 -24 l -24 -6 l 18 -16 l -14 -20 l 24 2 l 2 -24 l 18 14 Z"/>
    <path transform="translate(0 -12)" fill="none" stroke-width="4" d="M264 76 l 6 -4 M284 74 l 6 4 M266 90 c 8 8 18 8 26 0"/>

    <!-- little blob with raised arms (bottom right) -->
    <path d="M404 380 c -4 -26 10 -44 30 -44 c 22 0 34 18 30 44 c -2 22 -14 34 -30 34 c -16 0 -28 -12 -30 -34 Z"/>
    <path fill="none" d="M404 372 l -22 -20 M464 368 l 20 -22 M418 414 l -4 18 M448 414 l 4 18"/>
    <path fill="#111" stroke-width="2" d="M424 366 m -4 0 a 4 4 0 1 0 8 0 a 4 4 0 1 0 -8 0 M446 366 m -4 0 a 4 4 0 1 0 8 0 a 4 4 0 1 0 -8 0"/>
    <path fill="none" stroke-width="4" d="M424 386 c 8 10 18 10 24 0"/>

    <!-- worried bean (bottom left) -->
    <path d="M72 420 c -4 -30 14 -52 36 -50 c 22 2 32 26 26 52 c -6 26 -24 38 -40 34 c -12 -4 -20 -16 -22 -36 Z"/>
    <path fill="none" stroke-width="4" d="M92 392 l 10 4 M122 392 l -10 4"/>
    <path fill="#111" stroke-width="2" d="M98 404 m -4 0 a 4 4 0 1 0 8 0 a 4 4 0 1 0 -8 0 M116 404 m -4 0 a 4 4 0 1 0 8 0 a 4 4 0 1 0 -8 0"/>
    <path fill="none" stroke-width="4" d="M100 424 c 6 -6 12 -6 18 0"/>

    <!-- small grinning face-orb (right) -->
    <path d="M470 290 m -24 0 a 24 24 0 1 0 48 0 a 24 24 0 1 0 -48 0"/>
    <path fill="none" stroke-width="4" d="M458 284 l 6 -4 l 6 4 M474 284 l 6 -4 l 6 4 M460 298 c 6 8 16 8 22 0"/>
  </g>

  <g fill="none" stroke="#111" stroke-linecap="round" stroke-width="5">
    <!-- sparkles and doodle dots -->
    <path d="M52 204 l 16 0 M60 196 l 0 16"/>
    <path d="M216 452 l 14 0 M223 445 l 0 14 M218 447 l 10 10 M228 447 l -10 10"/>
    <path d="M330 450 c 10 -12 24 -12 30 0 c 6 12 20 12 28 0"/>
    <path d="M460 110 l 14 0 M467 103 l 0 14"/>
  </g>
  </g>
</svg>
