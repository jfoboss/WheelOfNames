    <circle fill="#2A1E17" stroke="none" cx="206" cy="254" r="9"/>
    <circle fill="#2A1E17" stroke="none" cx="332" cy="254" r="9"/>
    <!-- nose and mouth -->
    <path fill="#FF7A8A" stroke-width="7" d="M240 300 L 272 300 L 256 318 Z"/>
    <path fill="none" stroke-width="7" d="M256 318 C 256 340, 232 348, 218 334 M256 318 C 256 340, 280 348, 294 334"/>
    <!-- whiskers -->
    <path fill="none" stroke-width="5" d="M178 328 L 110 316 M180 344 L 114 352 M334 328 L 402 316 M332 344 L 398 352"/>
