    <path fill="#F29A4A" d="M130 210 L 150 86 L 236 150 Z"/>
    <path fill="#F29A4A" d="M382 210 L 362 86 L 276 150 Z"/>
    <path fill="#FFB7A8" stroke-width="6" d="M156 176 L 164 118 L 206 150 Z"/>
    <path fill="#FFB7A8" stroke-width="6" d="M356 176 L 348 118 L 306 150 Z"/>
    <!-- head -->
    <path fill="#F29A4A" d="M256 138 C 360 138, 412 200, 412 280 C 412 364, 340 412, 256 412 C 172 412, 100 364, 100 280 C 100 200, 152 138, 256 138 Z"/>
    <!-- stripes -->
    <path fill="none" stroke-width="8" d="M226 150 l 8 34 M256 146 l 0 40 M286 150 l -8 34"/>
    <path fill="none" stroke-width="8" d="M104 262 l 34 8 M106 296 l 32 0 M408 262 l -34 8 M406 296 l -32 0"/>
