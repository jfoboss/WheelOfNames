<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Колесо имён</title>
  <meta name="description" content="Случайный выбор из списка: впишите имена и крутите колесо">
  <meta name="theme-color" content="#E9EDF5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1526" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Колесо">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <input id="title" class="title" value="Колесо имён" maxlength="60" spellcheck="false"
           autocomplete="off" aria-label="Название колеса">
    <div class="bar-actions">
      <button id="installBtn" class="btn" type="button" hidden>Установить</button>
      <button id="shareBtn" class="btn" type="button" title="Скопировать ссылку с текущим списком">Поделиться списком</button>
      <button id="fullscreenBtn" class="btn btn-icon" type="button" title="Во весь экран" aria-label="Во весь экран">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Колесо">
      <div class="wheel-wrap" id="wheelWrap">
        <canvas id="wheel" role="img" aria-label="Колесо с участниками"></canvas>
        <div class="pointer" id="pointer" aria-hidden="true"></div>
        <button id="spinBtn" class="hub" type="button">Крутить</button>
      </div>
      <p class="hint" id="hint">Нажмите на колесо или Ctrl+Enter</p>
    </section>

    <aside class="panel">
      <div class="tabs" role="tablist" aria-label="Разделы">
        <button class="tab" role="tab" id="tab-entries" aria-controls="pane-entries" aria-selected="true" type="button">
          Участники <span class="count" id="count">0</span>
        </button>
        <button class="tab" role="tab" id="tab-results" aria-controls="pane-results" aria-selected="false" tabindex="-1" type="button">
          Результаты <span class="count" id="resultsCount">0</span>
        </button>
        <button class="tab" role="tab" id="tab-settings" aria-controls="pane-settings" aria-selected="false" tabindex="-1" type="button">
          Настройки
        </button>
      </div>

      <div class="pane" id="pane-entries" role="tabpanel" aria-labelledby="tab-entries">
        <textarea id="entries" class="entries" spellcheck="false" autocomplete="off"
                  placeholder="По одному имени в строке" aria-label="Список участников, по одному в строке"></textarea>
        <div class="row">
          <button id="shuffleBtn" class="btn" type="button">Перемешать</button>
          <button id="sortBtn" class="btn" type="button">По алфавиту</button>
          <button id="dedupeBtn" class="btn" type="button">Убрать повторы</button>
        </div>
      </div>

      <div class="pane" id="pane-results" role="tabpanel" aria-labelledby="tab-results" hidden>
        <p class="empty" id="resultsEmpty">Здесь по порядку появятся выпавшие имена.</p>
        <ol class="results" id="results"></ol>
        <div class="row">
          <button id="restoreBtn" class="btn" type="button" hidden>Вернуть убранных в список</button>
          <button id="clearResultsBtn" class="btn" type="button">Очистить результаты</button>
        </div>
      </div>

      <div class="pane settings" id="pane-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
        <label class="field">
          <span class="field-head">Длительность вращения <output id="durationOut" for="duration">6 с</output></span>
          <input type="range" id="duration" min="2" max="20" step="1" value="6">
        </label>
        <label class="check"><input type="checkbox" id="sound"> Звук</label>
        <label class="check"><input type="checkbox" id="autoRemove"> Сразу убирать выпавшего из списка</label>
        <label class="check"><input type="checkbox" id="confettiOn"> Конфетти</label>
        <p class="note">Список и результаты хранятся только в этом браузере. Чтобы передать список коллегам, используйте «Поделиться списком».</p>
      </div>
    </aside>
  </main>

  <dialog id="winnerDialog" class="winner-dialog" aria-labelledby="winnerName">
    <div class="winner-card" id="winnerCard">
      <p class="winner-lead">Выпало</p>
      <p class="winner-name" id="winnerName"></p>
      <div class="row row-center">
        <button id="removeWinnerBtn" class="btn" type="button">Убрать из списка</button>
        <button id="closeWinnerBtn" class="btn btn-primary" type="button">Готово</button>
      </div>
    </div>
    <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js" defer></script>
</body>
</html>
