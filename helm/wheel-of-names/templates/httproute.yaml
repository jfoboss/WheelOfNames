{{- if .Values.httpRoute.enabled }}
{{- $root := . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wheel-of-names.fullname" . }}
  labels:
    {{- include "wheel-of-names.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs обязателен" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- toYaml .Values.httpRoute.matches | nindent 8 }}
      {{- if or .Values.traefikMiddlewares .Values.httpRoute.filters }}
      filters:
        {{- range .Values.traefikMiddlewares }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ include "wheel-of-names.middlewareName" (dict "root" $root "name" .name) }}
        {{- end }}
        {{- with .Values.httpRoute.filters }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      backendRefs:
        - name: {{ include "wheel-of-names.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
