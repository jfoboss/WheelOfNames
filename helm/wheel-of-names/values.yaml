replicaCount: 2

image:
  repository: harbor.example.local/tools/wheel-of-names
  # По умолчанию берётся appVersion из Chart.yaml
  tag: ""
  pullPolicy: IfNotPresent

# Если проект в Harbor приватный:
# imagePullSecrets:
#   - name: harbor-pull
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

# emptyDir на /tmp: nginx-unprivileged пишет туда pid и temp-файлы
tmpVolume:
  medium: Memory
  sizeLimit: 16Mi

service:
  type: ClusterIP
  port: 80

# PWA и service worker работают только по HTTPS с сертификатом, которому доверяют браузеры
# (корпоративный CA должен быть в доверенных на рабочих станциях).
ingress:
  enabled: true
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: corp-ca-issuer
  hosts:
    - host: wheel.example.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: wheel-of-names-tls
      hosts:
        - wheel.example.local

# Gateway API — альтернатива Ingress. Обычно включают что-то одно:
#   ingress.enabled: false, httpRoute.enabled: true
httpRoute:
  enabled: false
  annotations: {}
  # К какому Gateway (и listener'у) цепляться
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      # sectionName: websecure
  hostnames:
    - wheel.example.local
  # Условия маршрута; по умолчанию — всё под /
  matches:
    - path:
        type: PathPrefix
        value: /
  # Дополнительные фильтры правила (RequestHeaderModifier, ExtensionRef на уже существующий Middleware и т.п.).
  # Middleware из traefikMiddlewares ниже подключаются автоматически, их сюда писать не нужно.
  filters: []

# Кастомные Traefik Middleware (traefik.io/v1alpha1), которые создаёт чарт.
# Имя ресурса: <fullname>-<name>. Подключаются автоматически:
#   - к HTTPRoute — фильтром ExtensionRef;
#   - к Ingress — аннотацией traefik.ingress.kubernetes.io/router.middlewares (если attachToIngress: true).
# spec — как в документации Traefik, без изменений.
traefikMiddlewares: []
#  - name: ip-allowlist
#    spec:
#      ipAllowList:
#        sourceRange:
#          - 10.0.0.0/8
#  - name: security-headers
#    spec:
#      headers:
#        stsSeconds: 31536000
#        stsIncludeSubdomains: true
traefikMiddlewaresAttachToIngress: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Пустое значение => мягкая anti-affinity по узлам (реплики на разных нодах, если можно)
affinity: {}
nodeSelector: {}
tolerations: []
